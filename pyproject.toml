[project]
name = "factorylens"
version = "0.1.0"
description = "RGB + 3D anomaly detection for industrial inspection"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bora Ilban Bayrakci" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=3.0.6",
    "pillow>=10.0",
    "scikit-learn>=1.9.1",
    "tifffile>=2024.1",
]

[project.scripts]
factorylens = "factorylens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorylens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["factorylens"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
strict = true
files = ["src"]

# torch is optional until the models land
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true
