[project]
name = "factorylens"
version = "0.1.0"
description = "RGB + 3D anomaly detection for industrial inspection"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bora Ilban Bayrakci" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=3.0.6",
    "pillow>=10.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tabulate>=0.10.0",
    "tifffile>=2024.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
factorylens = "factorylens.cli:main"

[project.optional-dependencies]
3d = [
    "open3d>=0.20.0",
]
serve = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]
demo = [
    "gradio>=6.30.0",
]

[dependency-groups]
analysis = [
    "shap>=0.51.0",
]
bench = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "matplotlib>=3.11.2",
    "scipy-stubs>=1.17.1.5",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorylens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["factorylens"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["torchvision", "torchvision.*", "sklearn", "sklearn.*", "open3d", "open3d.*"]
ignore_missing_imports = true

# CPU-only torch on Linux keeps CI from pulling ~2 GB of CUDA libraries;
# macOS wheels from PyPI already include MPS support
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
