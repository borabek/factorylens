[project]
name = "factorylens"
version = "0.1.0"
description = "RGB + 3D anomaly detection for industrial inspection"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bora Ilban Bayrakci" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "tifffile>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorylens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
