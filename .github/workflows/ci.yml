name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # the paper's tables are generated from results/; fail if someone edited one by hand
      # or changed a result without regenerating them
      - run: uv run python scripts/paper_assets.py && git diff --exit-code paper/generated

  # Everything runs on Linux, so a pull request never waits for a macOS runner. GitHub
  # sometimes assigns none and cancels the job after 15 minutes. macos.yml covers that side.
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra 3d --extra serve --extra demo
      # the FPFH tests skip themselves without open3d, so a broken install must fail here
      - run: uv run python -c "import open3d"
      - run: uv run pytest -q --cov --cov-report=term
