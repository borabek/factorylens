name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, same as the machine the experiments run on
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # open3d (FPFH features) needs libusb on macOS; the Linux job runs without
      # the 3d extra and skips those tests
      - if: runner.os == 'macOS'
        run: brew install libusb && uv sync --locked --extra 3d
      - if: runner.os != 'macOS'
        run: uv sync --locked
      - run: uv run pytest -q --cov --cov-report=term
